name: Check placeholder pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/evaluate.py --config configs/example.json --dry-run
      - run: python -m pip install numpy
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_metrics.py -v
