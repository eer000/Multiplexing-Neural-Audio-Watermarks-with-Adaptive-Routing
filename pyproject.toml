[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masknet-watermark"
version = "1.0.0"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch==2.10.0", "soundfile>=0.12"]

[project.optional-dependencies]
evaluation = ["pesq", "pystoi", "scipy", "torchaudio==2.10.0"]
codec-evaluation = ["speechtokenizer", "transformers", "descript-audio-codec"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
