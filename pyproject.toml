[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioseal-st-research"
version = "0.1.0.dev0"
description = "SpeechTokenizer-specific AudioSeal adaptation and watermark multiplexing research"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "torchaudio", "audioseal", "speechtokenizer", "soundfile", "pystoi", "pesq"]

[project.optional-dependencies]
multiplex = ["resemble-perth"]

[project.scripts]
audioseal-st-evaluate = "audioseal_st.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
